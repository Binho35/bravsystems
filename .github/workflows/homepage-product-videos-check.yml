name: Homepage Product Videos Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start app and ChromeDriver
        run: |
          npm start > /tmp/bravsystems-homepage.log 2>&1 &
          echo $! > /tmp/bravsystems-homepage.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          command -v google-chrome
          command -v chromedriver
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
          echo $! > /tmp/chromedriver.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:9515/status > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9515/status > /dev/null
      - name: Validate homepage discovery and playback
        run: |
          mkdir -p homepage-video-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const webdriver = 'http://127.0.0.1:9515';
          const expected = {
            bravos: {
              video: '/product-videos/16623CBB-AD78-4480-B09E-EE8E53335411.mp4',
              poster: '/product-videos/posters/bravos.svg',
            },
            bravhas: {
              video: '/product-videos/0CFE05FE-68C5-4278-B49A-594BCA0AFB55(1).mp4',
              poster: '/product-videos/posters/bravhas.svg',
            },
            bravvideo: {
              video: '/product-videos/5A6BC2BF-0A0B-4AFC-B8C9-77BB2AC84FBD.mp4',
              poster: '/product-videos/posters/bravvideo.svg',
            },
          };

          async function wd(method, path, body) {
            const response = await fetch(webdriver + path, {
              method,
              headers: body === undefined ? undefined : { 'content-type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok || data.value?.error) throw new Error(`${method} ${path}: ${text}`);
            return data.value;
          }

          async function execute(sessionId, script) {
            return wd('POST', `/session/${sessionId}/execute/sync`, { script, args: [] });
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitUntil(fn, label, timeout = 8000) {
            const started = Date.now();
            let value;
            while (Date.now() - started < timeout) {
              value = await fn();
              if (value) return value;
              await sleep(100);
            }
            throw new Error(`timeout: ${label}; last=${JSON.stringify(value)}`);
          }

          async function createSession(width, height) {
            const session = await wd('POST', '/session', {
              capabilities: {
                alwaysMatch: {
                  browserName: 'chrome',
                  'goog:chromeOptions': {
                    args: [
                      '--headless=new',
                      '--no-sandbox',
                      '--disable-dev-shm-usage',
                      '--autoplay-policy=no-user-gesture-required',
                      `--window-size=${width},${height}`,
                    ],
                  },
                },
              },
            });
            return session.sessionId;
          }

          async function loadHome(sessionId) {
            await wd('POST', `/session/${sessionId}/url`, { url: 'http://127.0.0.1:3000/' });
            await sleep(800);
            return execute(sessionId, `
              const resources = performance.getEntriesByType('resource').map((r) => r.name);
              const cards = [...document.querySelectorAll('[data-homepage-video]')].map((el) => el.getAttribute('data-homepage-video')).sort();
              const posters = [...document.querySelectorAll('[data-homepage-video] img')].map((img) => img.getAttribute('src') || '');
              const buttons = [...document.querySelectorAll('button')].filter((el) => el.textContent?.includes('Assistir apresentação'));
              return {
                overflow: document.documentElement.scrollWidth > window.innerWidth,
                cards,
                posterCount: posters.length,
                buttons: buttons.length,
                videos: document.querySelectorAll('video').length,
                oldSource: !!document.querySelector('source[src*="bravsystems-video-institucional.mp4"]'),
                oldRequest: resources.some((url) => url.includes('bravsystems-video-institucional.mp4')),
                productMp4Requests: resources.filter((url) => url.includes('/product-videos/') && url.includes('.mp4')),
              };
            `);
          }

          async function validateProduct(slug, width, height) {
            const sessionId = await createSession(width, height);
            const config = expected[slug];
            try {
              const initial = await loadHome(sessionId);
              const expectedCards = ['bravhas', 'bravos', 'bravvideo'];
              if (initial.overflow) throw new Error(`homepage overflow before click at ${width}`);
              if (JSON.stringify(initial.cards) !== JSON.stringify(expectedCards)) throw new Error(`wrong homepage video cards: ${JSON.stringify(initial.cards)}`);
              if (initial.posterCount !== 3) throw new Error(`expected 3 real posters, got ${initial.posterCount}`);
              if (initial.buttons !== 3) throw new Error(`expected exactly 3 homepage video CTAs, got ${initial.buttons}`);
              if (initial.videos !== 0) throw new Error(`homepage mounted video before click: ${initial.videos}`);
              if (initial.oldSource || initial.oldRequest) throw new Error('legacy institutional BravOS video still present or requested');
              if (initial.productMp4Requests.length !== 0) throw new Error(`product MP4 downloaded before click: ${initial.productMp4Requests}`);

              const visibility = await execute(sessionId, `
                const card = document.querySelector('[data-homepage-video="${slug}"]');
                const button = card && [...card.querySelectorAll('button')].find((el) => el.textContent?.includes('Assistir apresentação'));
                if (!card || !button) return null;
                card.scrollIntoView({ block: 'center' });
                const rect = button.getBoundingClientRect();
                return { visible: rect.width > 0 && rect.height > 0, text: button.textContent, poster: card.querySelector('img')?.getAttribute('src') || '' };
              `);
              if (!visibility?.visible || !visibility.text?.includes('Assistir apresentação')) throw new Error(`${slug} CTA not visually discoverable`);
              if (!visibility.poster.includes(config.poster)) throw new Error(`${slug} wrong homepage poster: ${visibility.poster}`);

              await execute(sessionId, `
                const card = document.querySelector('[data-homepage-video="${slug}"]');
                const button = [...card.querySelectorAll('button')].find((el) => el.textContent?.includes('Assistir apresentação'));
                button.click();
                return true;
              `);
              await waitUntil(() => execute(sessionId, `return document.querySelector('dialog')?.open === true;`), `${slug} homepage dialog open`);

              const opened = await execute(sessionId, `
                const video = document.querySelector('dialog video');
                if (!video) return null;
                return {
                  src: video.currentSrc || video.querySelector('source')?.src || '',
                  poster: video.getAttribute('poster'),
                  autoplay: video.autoplay,
                  paused: video.paused,
                  currentTime: video.currentTime,
                  controls: video.controls,
                  playsInline: video.playsInline,
                  count: document.querySelectorAll('video').length,
                  overflow: document.documentElement.scrollWidth > window.innerWidth,
                };
              `);
              if (!opened) throw new Error(`${slug} video missing after homepage CTA`);
              if (!opened.src.includes(config.video)) throw new Error(`${slug} wrong source: ${opened.src}`);
              if (opened.poster !== config.poster) throw new Error(`${slug} wrong modal poster: ${opened.poster}`);
              if (opened.autoplay || !opened.paused || opened.currentTime > 0.05) throw new Error(`${slug} autoplay/start violation`);
              if (!opened.controls || !opened.playsInline || opened.count !== 1) throw new Error(`${slug} player contract invalid`);
              if (opened.overflow) throw new Error(`${slug} overflow with dialog at ${width}`);

              await execute(sessionId, `document.querySelector('dialog video').play(); return true;`);
              const progressed = await waitUntil(async () => {
                const state = await execute(sessionId, `const v=document.querySelector('dialog video'); return v ? {t:v.currentTime,d:v.duration}:null;`);
                return state && state.t > 0.20 ? state : false;
              }, `${slug} homepage play`);
              if (!Number.isFinite(progressed.d) || progressed.d <= 1) throw new Error(`${slug} invalid duration ${progressed.d}`);

              await execute(sessionId, `document.querySelector('dialog video').pause(); return true;`);
              const paused = await waitUntil(async () => {
                const state = await execute(sessionId, `const v=document.querySelector('dialog video'); return v ? {paused:v.paused,t:v.currentTime}:null;`);
                return state?.paused ? state : false;
              }, `${slug} homepage pause`);
              const pauseAt = paused.t;
              await sleep(300);
              const held = await execute(sessionId, `const v=document.querySelector('dialog video'); return {paused:v.paused,t:v.currentTime};`);
              if (!held.paused || Math.abs(held.t - pauseAt) > 0.12) throw new Error(`${slug} pause did not hold`);

              const seekTarget = await execute(sessionId, `
                const v=document.querySelector('dialog video');
                const target=Math.min(v.duration*0.6,v.duration-0.8);
                v.currentTime=target;
                return target;
              `);
              await waitUntil(async () => {
                const t = await execute(sessionId, `return document.querySelector('dialog video')?.currentTime ?? -1;`);
                return Math.abs(t - seekTarget) < 0.35 ? true : false;
              }, `${slug} homepage seek`);

              const screenshot = await wd('GET', `/session/${sessionId}/screenshot`);
              fs.writeFileSync(`homepage-video-evidence/${slug}-${width}x${height}.png`, Buffer.from(screenshot, 'base64'));

              const requests = await execute(sessionId, `
                return [...new Set(performance.getEntriesByType('resource').map((r) => r.name).filter((url) => url.includes('/product-videos/') && url.includes('.mp4')))];
              `);
              if (!requests.some((url) => url.includes(config.video))) throw new Error(`${slug} expected MP4 request not observed`);
              const foreign = requests.filter((url) => !url.includes(config.video));
              if (foreign.length) throw new Error(`${slug} loaded foreign product MP4: ${foreign}`);

              await execute(sessionId, `document.querySelector("button[aria-label='Fechar apresentação']").click(); return true;`);
              await waitUntil(() => execute(sessionId, `return document.querySelector('dialog')?.open === false;`), `${slug} homepage close`);
              await waitUntil(() => execute(sessionId, `return document.querySelectorAll('video').length === 0;`), `${slug} homepage video unmount`);

              await execute(sessionId, `
                const card = document.querySelector('[data-homepage-video="${slug}"]');
                const button = [...card.querySelectorAll('button')].find((el) => el.textContent?.includes('Assistir apresentação'));
                button.click(); return true;
              `);
              await waitUntil(() => execute(sessionId, `return document.querySelector('dialog')?.open === true;`), `${slug} homepage reopen`);
              const reopened = await execute(sessionId, `const v=document.querySelector('dialog video'); return v ? {paused:v.paused,t:v.currentTime,autoplay:v.autoplay,count:document.querySelectorAll('video').length}:null;`);
              if (!reopened || !reopened.paused || reopened.t > 0.05 || reopened.autoplay || reopened.count !== 1) throw new Error(`${slug} invalid reopen state: ${JSON.stringify(reopened)}`);
              await execute(sessionId, `document.querySelector("button[aria-label='Fechar apresentação']").click(); return true;`);
              await waitUntil(() => execute(sessionId, `return document.querySelector('dialog')?.open === false;`), `${slug} final close`);

              console.log(`HOMEPAGE_VIDEO_PASS slug=${slug} viewport=${width}x${height} discoverable=YES poster=REAL initialDownload=NO legacyVideo=ABSENT autoplay=NO play=PASS pause=PASS seek=PASS close=PASS reopen=PASS overflow=NO source=CORRECT`);
            } finally {
              await wd('DELETE', `/session/${sessionId}`).catch(() => {});
            }
          }

          (async () => {
            for (const [width, height] of [[1440, 1000], [390, 844]]) {
              for (const slug of ['bravos', 'bravhas', 'bravvideo']) await validateProduct(slug, width, height);
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Upload homepage screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-product-videos-001c
          path: homepage-video-evidence/*.png
          if-no-files-found: error
      - name: Diagnostics
        if: failure()
        run: |
          echo '--- app log ---'
          tail -100 /tmp/bravsystems-homepage.log || true
          echo '--- chromedriver log ---'
          tail -100 /tmp/chromedriver.log || true
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/chromedriver.pid || kill "$(cat /tmp/chromedriver.pid)" 2>/dev/null || true
          test ! -f /tmp/bravsystems-homepage.pid || kill "$(cat /tmp/bravsystems-homepage.pid)" 2>/dev/null || true
