name: Homepage Product Videos Final Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start app and ChromeDriver
        run: |
          npm start > /tmp/app.log 2>&1 & echo $! > /tmp/app.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 & echo $! > /tmp/chromedriver.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:9515/status >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:9515/status >/dev/null
      - name: Validate homepage
        run: |
          mkdir -p homepage-video-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const wd = 'http://127.0.0.1:9515';
          const cfg = {
            bravos: ['/product-videos/16623CBB-AD78-4480-B09E-EE8E53335411.mp4','/product-videos/posters/bravos.svg'],
            bravhas: ['/product-videos/0CFE05FE-68C5-4278-B49A-594BCA0AFB55(1).mp4','/product-videos/posters/bravhas.svg'],
            bravvideo: ['/product-videos/5A6BC2BF-0A0B-4AFC-B8C9-77BB2AC84FBD.mp4','/product-videos/posters/bravvideo.svg'],
          };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function call(method,path,body){
            const r=await fetch(wd+path,{method,headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});
            const t=await r.text(); const j=t?JSON.parse(t):{};
            if(!r.ok||j.value?.error) throw new Error(`${method} ${path}: ${t}`); return j.value;
          }
          async function ex(s,script){return call('POST',`/session/${s}/execute/sync`,{script,args:[]});}
          async function wait(fn,label,timeout=8000){const start=Date.now();let v;while(Date.now()-start<timeout){v=await fn();if(v)return v;await sleep(100);}throw new Error(`timeout ${label}: ${JSON.stringify(v)}`);}
          async function session(w,h){const v=await call('POST','/session',{capabilities:{alwaysMatch:{browserName:'chrome','goog:chromeOptions':{args:['--headless=new','--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required',`--window-size=${w},${h}`]}}}});return v.sessionId;}
          async function validate(slug,w,h){
            const s=await session(w,h); const [src,poster]=cfg[slug]; const ds=`dialog[aria-labelledby="video-title-${slug}"]`;
            try{
              await call('POST',`/session/${s}/url`,{url:'http://127.0.0.1:3000/'}); await sleep(800);
              const initial=await ex(s,`const rs=performance.getEntriesByType('resource').map(r=>r.name);return {cards:[...document.querySelectorAll('[data-homepage-video]')].map(e=>e.dataset.homepageVideo).sort(),buttons:[...document.querySelectorAll('[data-homepage-video] button')].filter(b=>b.textContent.includes('Assistir apresentação')).length,videos:document.querySelectorAll('video').length,old:!!document.querySelector('source[src*="bravsystems-video-institucional.mp4"]')||rs.some(u=>u.includes('bravsystems-video-institucional.mp4')),mp4:rs.filter(u=>u.includes('/product-videos/')&&u.includes('.mp4')),overflow:document.documentElement.scrollWidth>window.innerWidth};`);
              if(JSON.stringify(initial.cards)!==JSON.stringify(['bravhas','bravos','bravvideo'])) throw new Error(`cards ${JSON.stringify(initial.cards)}`);
              if(initial.buttons!==3||initial.videos!==0||initial.old||initial.mp4.length||initial.overflow) throw new Error(`initial ${JSON.stringify(initial)}`);
              const visible=await ex(s,`const c=document.querySelector('[data-homepage-video="${slug}"]');const b=[...c.querySelectorAll('button')].find(x=>x.textContent.includes('Assistir apresentação'));c.scrollIntoView({block:'center'});const r=b.getBoundingClientRect();return {visible:r.width>0&&r.height>0,poster:c.querySelector('img')?.getAttribute('src')||''};`);
              if(!visible.visible||!visible.poster.includes(poster)) throw new Error(`discoverability ${JSON.stringify(visible)}`);
              await ex(s,`const c=document.querySelector('[data-homepage-video="${slug}"]');[...c.querySelectorAll('button')].find(x=>x.textContent.includes('Assistir apresentação')).click();return true;`);
              await wait(()=>ex(s,`return !!document.querySelector('${ds}[open] video');`),`${slug} open video`);
              const opened=await ex(s,`const v=document.querySelector('${ds} video');return {src:v.currentSrc||v.querySelector('source')?.src||'',poster:v.getAttribute('poster'),paused:v.paused,t:v.currentTime,autoplay:v.autoplay,controls:v.controls,inline:v.playsInline,count:document.querySelectorAll('video').length,overflow:document.documentElement.scrollWidth>window.innerWidth};`);
              if(!opened.src.includes(src)||opened.poster!==poster||!opened.paused||opened.t>0.05||opened.autoplay||!opened.controls||!opened.inline||opened.count!==1||opened.overflow) throw new Error(`opened ${JSON.stringify(opened)}`);
              await ex(s,`document.querySelector('${ds} video').play();return true;`);
              const progress=await wait(()=>ex(s,`const v=document.querySelector('${ds} video');return v&&v.currentTime>.2?{t:v.currentTime,d:v.duration}:false;`),`${slug} play`);
              if(!Number.isFinite(progress.d)||progress.d<=1) throw new Error(`duration ${progress.d}`);
              await ex(s,`document.querySelector('${ds} video').pause();return true;`); const p=await wait(()=>ex(s,`const v=document.querySelector('${ds} video');return v?.paused?{t:v.currentTime}:false;`),`${slug} pause`); await sleep(300); const p2=await ex(s,`const v=document.querySelector('${ds} video');return {paused:v.paused,t:v.currentTime};`); if(!p2.paused||Math.abs(p2.t-p.t)>.12) throw new Error('pause hold');
              const target=await ex(s,`const v=document.querySelector('${ds} video');const t=Math.min(v.duration*.6,v.duration-.8);v.currentTime=t;return t;`); await wait(()=>ex(s,`const v=document.querySelector('${ds} video');return v&&Math.abs(v.currentTime-${target})<.35;`),`${slug} seek`);
              const shot=await call('GET',`/session/${s}/screenshot`); fs.writeFileSync(`homepage-video-evidence/${slug}-${w}x${h}.png`,Buffer.from(shot,'base64'));
              const req=await ex(s,`return [...new Set(performance.getEntriesByType('resource').map(r=>r.name).filter(u=>u.includes('/product-videos/')&&u.includes('.mp4')))];`); if(!req.some(u=>u.includes(src))||req.some(u=>!u.includes(src))) throw new Error(`requests ${JSON.stringify(req)}`);
              await ex(s,`document.querySelector('${ds} button[aria-label="Fechar apresentação"]').click();return true;`); await wait(()=>ex(s,`return !document.querySelector('${ds}')?.open&&document.querySelectorAll('video').length===0;`),`${slug} close`);
              await ex(s,`const c=document.querySelector('[data-homepage-video="${slug}"]');[...c.querySelectorAll('button')].find(x=>x.textContent.includes('Assistir apresentação')).click();return true;`);
              const reopened=await wait(()=>ex(s,`const d=document.querySelector('${ds}');const v=d?.querySelector('video');return d?.open&&v?{paused:v.paused,t:v.currentTime,autoplay:v.autoplay,count:document.querySelectorAll('video').length}:false;`),`${slug} reopen video`);
              if(!reopened.paused||reopened.t>.05||reopened.autoplay||reopened.count!==1) throw new Error(`reopened ${JSON.stringify(reopened)}`);
              await ex(s,`document.querySelector('${ds} button[aria-label="Fechar apresentação"]').click();return true;`); await wait(()=>ex(s,`return !document.querySelector('${ds}')?.open;`),`${slug} final close`);
              console.log(`HOMEPAGE_VIDEO_PASS slug=${slug} viewport=${w}x${h} discoverable=YES poster=REAL initialDownload=NO legacyVideo=ABSENT autoplay=NO play=PASS pause=PASS seek=PASS close=PASS reopen=PASS overflow=NO source=CORRECT`);
            }finally{await call('DELETE',`/session/${s}`).catch(()=>{});}
          }
          (async()=>{for(const [w,h] of [[1440,1000],[390,844]])for(const slug of ['bravos','bravhas','bravvideo'])await validate(slug,w,h);})().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homepage-product-videos-001c
          path: homepage-video-evidence/*.png
          if-no-files-found: error
      - name: Diagnostics
        if: failure()
        run: |
          tail -100 /tmp/app.log || true
          tail -100 /tmp/chromedriver.log || true
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/chromedriver.pid || kill "$(cat /tmp/chromedriver.pid)" 2>/dev/null || true
          test ! -f /tmp/app.pid || kill "$(cat /tmp/app.pid)" 2>/dev/null || true
