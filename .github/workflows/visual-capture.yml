name: Visual Capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start application
        run: |
          npm start > /tmp/bravsystems-server.log 2>&1 &
          echo $! > /tmp/bravsystems-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bravsystems-server.log
          exit 1
      - name: Capture desktop tablet and mobile
        run: |
          mkdir -p visual-evidence
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=3000 --screenshot=visual-evidence/desktop-1440x1000.png http://127.0.0.1:3000/
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=834,1112 --virtual-time-budget=3000 --screenshot=visual-evidence/tablet-834x1112.png http://127.0.0.1:3000/
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=3000 --screenshot=visual-evidence/mobile-390x844.png http://127.0.0.1:3000/
          ls -lh visual-evidence
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: bravsystems-portal-visual-evidence
          path: visual-evidence/*.png
