name: Dependency Refresh

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh Next patch and lockfile
        run: npm install next@16.3.4 eslint-config-next@16.3.4 --save-exact --package-lock-only
      - name: Apply nonbreaking audit fixes
        run: npm audit fix --package-lock-only
      - name: Capture refreshed dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Upload refreshed dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh
          path: |
            package.json
            package-lock.json
            npm-audit.json
      - name: Enforce high severity audit gate
        run: npm audit --audit-level=high
