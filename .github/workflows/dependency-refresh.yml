name: Dependency Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh Next patch and lockfile
        run: npm install next@16.3.4 eslint-config-next@16.3.4 --save-exact --package-lock-only
      - name: Apply nonbreaking audit fixes
        run: npm audit fix --package-lock-only
      - name: Enforce high severity audit gate
        run: npm audit --audit-level=high
      - name: Commit refreshed dependency files
        run: |
          git config user.name "bravsystems-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already current."
          else
            git commit -m "chore: atualiza Next para patch de segurança"
            git push origin HEAD:${{ github.head_ref }}
          fi
