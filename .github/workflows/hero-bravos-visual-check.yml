name: Hero BravOS Visual Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start app and ChromeDriver
        run: |
          npm start > /tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
          echo $! > /tmp/chromedriver.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:9515/status > /dev/null && break
            sleep 1
          done
      - name: Validate hero visual
        run: |
          mkdir -p hero-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'http://127.0.0.1:9515';
          async function req(method, path, body) {
            const r = await fetch(base + path, { method, headers: body ? {'content-type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined });
            const t = await r.text(); const j = t ? JSON.parse(t) : {};
            if (!r.ok || j.value?.error) throw new Error(`${method} ${path}: ${t}`);
            return j.value;
          }
          async function exec(id, script) { return req('POST', `/session/${id}/execute/sync`, {script,args:[]}); }
          async function run(width,height,file) {
            const s = await req('POST','/session',{capabilities:{alwaysMatch:{browserName:'chrome','goog:chromeOptions':{args:['--headless=new','--no-sandbox','--disable-dev-shm-usage',`--window-size=${width},${height}`]}}}});
            const id=s.sessionId;
            try {
              await req('POST',`/session/${id}/url`,{url:'http://127.0.0.1:3000/'});
              await new Promise(r=>setTimeout(r,900));
              const result=await exec(id, `
                const grid=document.querySelector('[aria-label="Fluxo operacional do BravOS"]');
                if(!grid) return {ok:false,reason:'grid missing'};
                const style=getComputedStyle(grid);
                const childDisplays=[...grid.children].map(el=>getComputedStyle(el).display);
                return {
                  ok: style.backgroundImage.includes('bravos-hero-dashboard.svg') && childDisplays.every(v=>v==='none'),
                  background: style.backgroundImage,
                  childDisplays,
                  overflow: document.documentElement.scrollWidth > window.innerWidth,
                  assetRequested: performance.getEntriesByType('resource').some(e=>e.name.includes('/bravos-hero-dashboard.svg')),
                  oldBlueBlocksVisible: [...grid.children].some(el=>getComputedStyle(el).display!=='none')
                };
              `);
              console.log(`viewport=${width}x${height}`, JSON.stringify(result));
              if(!result.ok) throw new Error('new hero visual not applied');
              if(result.overflow) throw new Error('horizontal overflow');
              if(!result.assetRequested) throw new Error('hero asset not requested');
              if(result.oldBlueBlocksVisible) throw new Error('old blue blocks still visible');
              const shot=await req('GET',`/session/${id}/screenshot`);
              fs.writeFileSync(file,Buffer.from(shot,'base64'));
            } finally { await req('DELETE',`/session/${id}`).catch(()=>{}); }
          }
          (async()=>{await run(1440,1000,'hero-evidence/desktop-1440x1000.png');await run(390,844,'hero-evidence/mobile-390x844.png')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hero-bravos-visual-evidence
          path: hero-evidence/*.png
          if-no-files-found: error
      - if: always()
        run: |
          test ! -f /tmp/chromedriver.pid || kill "$(cat /tmp/chromedriver.pid)" 2>/dev/null || true
          test ! -f /tmp/site.pid || kill "$(cat /tmp/site.pid)" 2>/dev/null || true
