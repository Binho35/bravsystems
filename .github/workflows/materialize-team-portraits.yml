name: Materialize team portraits

on:
  push:
    branches:
      - feat/team-approved-portraits-002

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/team-approved-portraits-002
          fetch-depth: 0
      - name: Decode JPEGs
        shell: bash
        run: |
          set -euo pipefail
          for name in atlas forge sentry orion sofia vega lira marco; do
            test -s "public/team/$name.jpg.b64"
            base64 --decode "public/team/$name.jpg.b64" > "public/team/$name.jpg"
            test "$(head -c 2 "public/team/$name.jpg" | od -An -tx1 | tr -d ' \n')" = "ffd8"
            test "$(tail -c 2 "public/team/$name.jpg" | od -An -tx1 | tr -d ' \n')" = "ffd9"
            file "public/team/$name.jpg" | grep -q "JPEG image data"
          done
      - name: Commit materialized assets and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/team/*.jpg.b64 public/team/_probe.txt
          git rm -f .github/workflows/materialize-team-portraits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/team/*.jpg
          git add -u
          git commit -m "fix: materializa oito retratos JPEG válidos"
          git push origin HEAD:feat/team-approved-portraits-002
