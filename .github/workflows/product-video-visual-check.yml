name: Product Video Visual Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start app and ChromeDriver
        run: |
          npm start > /tmp/bravsystems-video-ui.log 2>&1 &
          echo $! > /tmp/bravsystems-video-ui.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/bravos > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/bravos > /dev/null
          command -v google-chrome
          command -v chromedriver
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
          echo $! > /tmp/chromedriver.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:9515/status > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9515/status > /dev/null
      - name: Validate desktop and mobile modal UX
        run: |
          mkdir -p visual-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'http://127.0.0.1:9515';
          async function request(method, path, body) {
            const response = await fetch(base + path, {
              method,
              headers: body ? { 'content-type': 'application/json' } : undefined,
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await response.text();
            const json = text ? JSON.parse(text) : {};
            if (!response.ok || json.value?.error) throw new Error(`${method} ${path}: ${text}`);
            return json.value;
          }
          async function execute(sessionId, script) {
            return request('POST', `/session/${sessionId}/execute/sync`, { script, args: [] });
          }
          async function run(width, height, filename) {
            const session = await request('POST', '/session', {
              capabilities: { alwaysMatch: { browserName: 'chrome', 'goog:chromeOptions': { args: ['--headless=new', '--no-sandbox', '--disable-dev-shm-usage', `--window-size=${width},${height}`] } } },
            });
            const sessionId = session.sessionId;
            try {
              await request('POST', `/session/${sessionId}/url`, { url: 'http://127.0.0.1:3000/bravos' });
              await new Promise((resolve) => setTimeout(resolve, 700));
              const noInitialProductVideoRequest = await execute(sessionId, "return !performance.getEntriesByType('resource').some((entry) => entry.name.includes('/product-videos/'));");
              if (!noInitialProductVideoRequest) throw new Error('product video requested before user interaction');
              const noOverflow = await execute(sessionId, 'return document.documentElement.scrollWidth <= window.innerWidth;');
              if (!noOverflow) throw new Error(`horizontal overflow at ${width}px`);
              const openedByClick = await execute(sessionId, "const button=[...document.querySelectorAll('button')].find((el)=>el.textContent?.includes('Assistir apresentação')); if(!button) return false; button.scrollIntoView({block:'center'}); button.click(); return true;");
              if (!openedByClick) throw new Error(`video trigger not found at ${width}px`);
              await new Promise((resolve) => setTimeout(resolve, 250));
              const opened = await execute(sessionId, "return document.querySelector('dialog')?.open === true;");
              if (!opened) throw new Error(`dialog did not open at ${width}px`);
              const screenshot = await request('GET', `/session/${sessionId}/screenshot`);
              fs.writeFileSync(filename, Buffer.from(screenshot, 'base64'));
              const closedByClick = await execute(sessionId, "const button=document.querySelector(\"button[aria-label='Fechar apresentação']\"); if(!button) return false; button.click(); return true;");
              if (!closedByClick) throw new Error(`close button not found at ${width}px`);
              await new Promise((resolve) => setTimeout(resolve, 100));
              const closed = await execute(sessionId, "return document.querySelector('dialog')?.open === false;");
              if (!closed) throw new Error(`dialog did not close at ${width}px`);
              console.log(`viewport=${width}x${height} initialVideoRequest=NO overflow=NO modalOpen=PASS modalClose=PASS`);
            } finally {
              await request('DELETE', `/session/${sessionId}`).catch(() => {});
            }
          }
          (async () => {
            await run(1440, 1000, 'visual-evidence/desktop-1440x1000.png');
            await run(390, 844, 'visual-evidence/mobile-390x844.png');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: product-video-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/chromedriver.pid || kill "$(cat /tmp/chromedriver.pid)" 2>/dev/null || true
          test ! -f /tmp/bravsystems-video-ui.pid || kill "$(cat /tmp/bravsystems-video-ui.pid)" 2>/dev/null || true
