name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/commercial-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: JPEG full decode gate
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          slugs = ["atlas", "forge", "sentry", "orion", "sofia", "vega", "lira", "marco"]
          for slug in slugs:
              path = Path("public/team") / f"{slug}.jpg"
              data = path.read_bytes()
              assert len(data) >= 100_000, f"{slug}: arquivo pequeno ({len(data)} bytes)"
              assert data[:2] == b"\xff\xd8" and data[-2:] == b"\xff\xd9", f"{slug}: assinatura JPEG inválida"
              with Image.open(path) as image:
                  image.load()
                  assert image.format == "JPEG", f"{slug}: formato {image.format}"
                  assert image.mode == "RGB", f"{slug}: modo {image.mode}"
                  assert image.width >= 1200 and image.height >= 1200, f"{slug}: resolução {image.size}"
                  print(f"{slug}: PASS {image.width}x{image.height} RGB {len(data)} bytes")
          PY
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Browser E2E desktop/mobile/tablet
        run: |
          node --test tests/portal.browser.mjs
          node --test tests/team.browser.mjs
          node --test tests/team.visual.browser.mjs
          node --test tests/site-hardening.browser.mjs
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: WebKit team gate
        run: node --test tests/team.webkit.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravsystems-site-evidence-${{ github.sha }}
          path: artifacts/browser/*.png
          if-no-files-found: warn
          retention-days: 14
