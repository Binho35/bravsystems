name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/commercial-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Institutional asset gate
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY_ASSET'
          from PIL import Image
          from pathlib import Path

          team_dir = Path("public/team")
          files = sorted(path.name for path in team_dir.iterdir() if path.is_file())
          assert files == ["robson.svg"], f"assets públicos de equipe inesperados: {files}"

          robson = (team_dir / "robson.svg").read_text()
          assert "Retrato institucional de Robson" in robson
          assert "data:image/jpeg;base64," in robson

          logo = Path("public/bravsystems-logo.png")
          with Image.open(logo) as image:
              image.load()
              assert image.format == "PNG"
              assert image.width == 1254 and image.height == 1254
              assert image.mode in {"RGB", "RGBA"}
              print(f"Harpia/logo: PASS {image.width}x{image.height} {image.mode}")
          PY_ASSET
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Browser E2E desktop/mobile/tablet
        run: |
          node --test tests/portal.browser.mjs
          node --test tests/team.browser.mjs
          node --test tests/team.visual.browser.mjs
          node --test tests/site-hardening.browser.mjs
          node --test tests/academy-journey.browser.mjs
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: WebKit team gate
        run: |
          node --test tests/team.webkit.mjs
          node --test tests/site-audit.webkit.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravsystems-site-evidence-${{ github.sha }}
          path: artifacts/browser/*.png
          if-no-files-found: warn
          retention-days: 14
