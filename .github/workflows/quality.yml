name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/commercial-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Browser E2E desktop/mobile/tablet
        run: |
          node --test tests/portal.browser.mjs
          node --test tests/team.browser.mjs
          node --test tests/site-hardening.browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravsystems-site-evidence-${{ github.sha }}
          path: artifacts/browser/*.png
          if-no-files-found: warn
          retention-days: 14
