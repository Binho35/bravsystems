name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/commercial-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Contact API fail-closed smoke
        env:
          RESEND_API_KEY: ""
        run: |
          npm start > /tmp/bravsystems-contact-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/bravsystems-contact-smoke.log
            exit 1
          fi

          invalid_status=$(curl -sS -o /tmp/contact-invalid.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3000/api/contact \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$invalid_status" = "400"

          failure_status=$(curl -sS -o /tmp/contact-failure.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3000/api/contact \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI Smoke","email":"ci-smoke@example.invalid","interest":"BravOS","consent":true,"message":"Synthetic CI validation"}')
          test "$failure_status" = "503"

          if grep -q 'Recebemos seu contato' /tmp/contact-failure.json; then
            echo "Falha simulada retornou falso sucesso"
            exit 1
          fi
          grep -q 'Não foi possível enviar sua solicitação agora' /tmp/contact-failure.json
