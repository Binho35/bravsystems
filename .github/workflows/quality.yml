name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/commercial-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser E2E desktop/mobile
        run: node --test tests/portal.browser.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bravsystems-saas-portal-visual-${{ github.sha }}
          path: artifacts/browser/*.png
          if-no-files-found: warn
          retention-days: 14
