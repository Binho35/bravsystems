name: Hero Approved Visual Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect candidate image blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in \
            329346794b9860ce272378c6ecae6c8d60442c9d \
            65b1174d30f12a4487a9b6404dc6b464029032d5 \
            b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0 \
            89566caf5254c6f39884d6442a8abc42ee7bb1f3
          do
            echo "candidate=$sha"
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Binho35/bravsystems/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/$sha.bin"
            wc -c "/tmp/$sha.bin"
            sha256sum "/tmp/$sha.bin"
            file "/tmp/$sha.bin" || true
          done
      - name: Start app and ChromeDriver
        run: |
          npm start > /tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
          echo $! > /tmp/chromedriver.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:9515/status > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9515/status > /dev/null
      - name: Validate exact approved asset bytes
        run: |
          curl -fsS http://127.0.0.1:3000/bravos-hero-approved.webp -o /tmp/bravos-hero-approved.webp
          echo "served-bytes=$(wc -c < /tmp/bravos-hero-approved.webp)"
          echo "served-sha256=$(sha256sum /tmp/bravos-hero-approved.webp | awk '{print $1}')"
          file /tmp/bravos-hero-approved.webp || true
          test "$(sha256sum /tmp/bravos-hero-approved.webp | awk '{print $1}')" = "391f08cedc6c6d2b6856cb2846b19f8f037ee3a22e75a201133f6bac72dfb8d7"
      - name: Validate approved hero in desktop and mobile
        run: |
          mkdir -p hero-approved-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'http://127.0.0.1:9515';
          async function req(method, path, body) {
            const r = await fetch(base + path, { method, headers: body ? {'content-type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined });
            const t = await r.text(); const j = t ? JSON.parse(t) : {};
            if (!r.ok || j.value?.error) throw new Error(`${method} ${path}: ${t}`);
            return j.value;
          }
          async function exec(id, script) { return req('POST', `/session/${id}/execute/sync`, {script,args:[]}); }
          async function run(width,height,file) {
            const s = await req('POST','/session',{capabilities:{alwaysMatch:{browserName:'chrome','goog:chromeOptions':{args:['--headless=new','--no-sandbox','--disable-dev-shm-usage',`--window-size=${width},${height}`]}}}});
            const id=s.sessionId;
            try {
              await req('POST',`/session/${id}/url`,{url:'http://127.0.0.1:3000/'});
              await new Promise(r=>setTimeout(r,1000));
              const result=await exec(id, `
                const done = arguments[arguments.length - 1];
                const grid=document.querySelector('[aria-label="Fluxo operacional do BravOS"]');
                if(!grid) return done({ok:false,reason:'hero target missing'});
                const img=new Image();
                img.onload=()=>{
                  const style=getComputedStyle(grid);
                  const resources=performance.getEntriesByType('resource').map(e=>e.name);
                  const rect=grid.getBoundingClientRect();
                  done({
                    ok: style.backgroundImage.includes('bravos-hero-approved.webp'),
                    decoded: img.naturalWidth===895 && img.naturalHeight===715,
                    naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight,
                    approvedRequested: resources.some(name=>name.includes('/bravos-hero-approved.webp')),
                    oldRequested: resources.some(name=>name.includes('/bravos-hero-dashboard.svg')),
                    oldChildrenVisible: [...grid.children].some(el=>getComputedStyle(el).display!=='none'),
                    overflow: document.documentElement.scrollWidth > window.innerWidth,
                    background: style.backgroundImage,
                    width: rect.width,
                    height: rect.height
                  });
                };
                img.onerror=()=>done({ok:false,decoded:false,reason:'approved asset failed to decode'});
                img.src='/bravos-hero-approved.webp?decode-check=1';
              `);
              console.log(`viewport=${width}x${height}`, JSON.stringify(result));
              if(!result.ok) throw new Error(result.reason || 'approved hero asset not applied');
              if(!result.decoded) throw new Error('approved hero asset did not decode at 895x715');
              if(!result.approvedRequested) throw new Error('approved hero asset not requested');
              if(result.oldRequested) throw new Error('old reinterpretation still requested');
              if(result.oldChildrenVisible) throw new Error('old blue grid children still visible');
              if(result.overflow) throw new Error('horizontal overflow');
              const shot=await req('GET',`/session/${id}/screenshot`);
              fs.writeFileSync(file,Buffer.from(shot,'base64'));
            } finally { await req('DELETE',`/session/${id}`).catch(()=>{}); }
          }
          (async()=>{
            await run(1440,1000,'hero-approved-evidence/desktop-1440x1000.png');
            await run(390,844,'hero-approved-evidence/mobile-390x844.png');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hero-approved-evidence
          path: hero-approved-evidence/*.png
          if-no-files-found: error
      - if: always()
        run: |
          test ! -f /tmp/chromedriver.pid || kill "$(cat /tmp/chromedriver.pid)" 2>/dev/null || true
          test ! -f /tmp/site.pid || kill "$(cat /tmp/site.pid)" 2>/dev/null || true
